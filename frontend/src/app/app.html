@if (auth.currentUser()?.mustChangePassword) {
  <div class="password-warning">
    <mat-icon>warning</mat-icon>
    <span>{{ 'auth.mustChangePassword' | transloco }}</span>
    <button mat-stroked-button (click)="goToChangePassword()">
      {{ 'auth.changePasswordNow' | transloco }}
    </button>
  </div>
}
